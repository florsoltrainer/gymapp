<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flor Sol Trainer - Portal de Acceso</title>
  <style>
    /* =========================================================
       1. VARIABLES: MODO OSCURO (DARK MODE) POR DEFECTO
       ========================================================= */
    :root {
      --bg: #121214;
      --card: #1e1e24;
      --accent: #00e676; 
      --accent-hover: #00c853;
      --text: #ffffff;
      --muted: #a0a0b0;
      --border: #2a2a35;
      --danger: #ff5252;
      --shadow: rgba(0, 0, 0, 0.5);
    }

    /* =========================================================
       2. MODO CLARO (LIGHT MODE): DETECCIÓN AUTOMÁTICA
       ========================================================= */
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f4f5f8;
        --card: #ffffff;
        --accent: #00b050; 
        --accent-hover: #008a3e;
        --text: #1a1a1e;
        --muted: #6c707e;
        --border: #e2e4e9;
        --danger: #e53935;
        --shadow: rgba(0, 0, 0, 0.08);
      }
    }

    /* =========================================================
       3. ESTILOS BASE Y MAQUETACIÓN
       ========================================================= */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 20px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 36px 24px;
      text-align: center;
      box-shadow: 0 10px 30px var(--shadow);
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }

    .logo {
      width: 100%;
      max-width: 260px;
      height: auto;
      margin-bottom: 24px;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }

    .welcome-title {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--text);
    }

    .welcome-sub {
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 28px;
    }

    button.btn-google { 
      background: #4285F4; 
      color: #fff; 
      font-weight: bold; 
      border: none; 
      padding: 14px 20px; 
      border-radius: 12px; 
      cursor: pointer; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      gap: 10px; 
      width: 100%; 
      font-size: 1rem; 
      transition: background 0.2s ease;
    }
    button.btn-google:hover { background: #3367d6; }

    .status-msg {
      margin-top: 20px;
      font-size: 0.9rem;
      font-weight: 500;
      line-height: 1.4;
    }

    .error-msg {
      color: var(--danger);
    }
  </style>

  <!-- Módulos de Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // ⚠️ CONFIGURACIÓN DE FIREBASE
    const firebaseConfig = {
      apiKey: "AIzaSyDC3Wvw3E8IhSnkSKg5Qk98NivuqK-FNzM",
      authDomain: "florsoltrainer-f22c2.firebaseapp.com",
      projectId: "florsoltrainer-f22c2",
      storageBucket: "florsoltrainer-f22c2.firebasestorage.app",
      messagingSenderId: "36053648611",
      appId: "1:36053648611:web:34f519fc41a12024f4f1d6"
    };

    const ADMIN_EMAIL = "florsoltrainer@gmail.com"; 

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    let isAuthenticating = false;

    // Escuchador de estado de sesión para el ruteo automático
    onAuthStateChanged(auth, async (user) => {
      if (user && !isAuthenticating) {
        await routeUser(user);
      }
    });

    // Función principal de ruteo inteligente
    async function routeUser(user) {
      const statusMsg = document.getElementById('statusMsg');
      const loginBtn = document.getElementById('loginBtn');
      const userEmail = user.email.toLowerCase().trim();

      statusMsg.className = "status-msg";
      loginBtn.style.display = 'none';

      // 1. ¿ES EL ADMINISTRADOR?
      if (userEmail === ADMIN_EMAIL.toLowerCase()) {
        statusMsg.textContent = "✅ Bienvenida Flor. Accediendo al panel...";
        setTimeout(() => {
          window.location.href = './admin.html';
        }, 1000);
        return; // Detiene la ejecución aquí
      }

      // 2. SI NO ES ADMIN, ¿ES UN ALUMNO REGISTRADO?
      statusMsg.textContent = `🔍 Verificando perfil de alumno para ${userEmail}...`;
      try {
        const alumnosRef = collection(db, "alumnos");
        const q = query(alumnosRef, where("email", "==", userEmail));
        const querySnapshot = await getDocs(q);

        if (!querySnapshot.empty) {
          let studentName = "";
          querySnapshot.forEach((doc) => { studentName = doc.data().nombre; });
          
          statusMsg.textContent = `✅ ¡Hola ${studentName || user.displayName}! Redirigiendo a tu rutina...`;
          setTimeout(() => {
            window.location.href = './alumnos.html';
          }, 1000);
        } else {
          // Si el correo no es de admin ni está en la base de alumnos
          statusMsg.className = "status-msg error-msg";
          statusMsg.textContent = `❌ Tu correo (${userEmail}) no está registrado. Consulta a tu entrenadora.`;
          loginBtn.style.display = 'flex';
          signOut(auth);
        }
      } catch (error) {
        console.error("Error al consultar la base de datos:", error);
        statusMsg.className = "status-msg error-msg";
        statusMsg.textContent = "❌ Error de conexión al verificar tus datos.";
        loginBtn.style.display = 'flex';
        signOut(auth);
      }
    }

    // Acción del botón único
    window.loginUnified = async function() {
      const statusMsg = document.getElementById('statusMsg');
      statusMsg.className = "status-msg";
      statusMsg.textContent = "⏳ Conectando con Google...";
      isAuthenticating = true; 

      try {
        const result = await signInWithPopup(auth, provider);
        await routeUser(result.user);
      } catch (error) {
        console.error("Error en autenticación:", error);
        statusMsg.className = "status-msg error-msg";
        statusMsg.textContent = "❌ Error al iniciar sesión: " + error.message;
        document.getElementById('loginBtn').style.display = 'flex';
      } finally {
        isAuthenticating = false;
      }
    };
  </script>
</head>
<body>

  <div class="container">
    <!-- LOGO CENTRADO -->
    <img src="logo fst.png" alt="Flor Sol Trainer - Tu mejor versión" class="logo" onerror="this.style.display='none'">

    <!-- BOTÓN ÚNICO E INTELIGENTE -->
    <div class="btn-container">
      <button id="loginBtn" class="btn-google" onclick="loginUnified()">
        <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.616z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/></svg>
        Iniciar sesión con Google
      </button>
    </div>

    <!-- MENSAJE DE ESTADO -->
    <div id="statusMsg" class="status-msg"></div>
  </div>

</body>
</html>
